<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPhotos - Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .app-icon {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin-bottom: 24px;
            margin-left: auto;
            margin-right: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        h1 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .tagline {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .language-prompt {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .language-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: #667eea;
            background: #f7fafc;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .lang-btn .flag {
            font-size: 1.5rem;
        }

        .footer {
            margin-top: 40px;
            color: #a0aec0;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-icon">📸</div>
        <h1>MyPhotos</h1>
        <p class="tagline">Manage your iCloud shared albums</p>

        <p class="language-prompt">Choose your language / Choisissez votre langue</p>

        <div class="language-buttons">
            <a href="en/" class="lang-btn" onclick="localStorage.setItem('myphotos-lang', 'en')">
                <span class="flag">🇬🇧</span>
                <span>English</span>
            </a>
            <a href="fr/" class="lang-btn" onclick="localStorage.setItem('myphotos-lang', 'fr')">
                <span class="flag">🇫🇷</span>
                <span>Français</span>
            </a>
        </div>

        <p class="footer">Your preference will be saved for future visits</p>
    </div>

    <script>
        // Redirect to saved language preference
        const savedLang = localStorage.getItem('myphotos-lang');
        if (savedLang) {
            window.location.href = savedLang + '/';
        }
    </script>
</body>
</html>
